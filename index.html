function rmHist(t,hi){const h=t.hist[hi];if(!h)return;if(t.noRev){t.hist.splice(hi,1);if(t.done[0])t.done[0].m=Math.max(0,(t.done[0].m||0)-(h.m||0));if(!t.hist.length)S.topics=S.topics.filter(x=>x!==t);return}const before=JSON.parse(stt(t)),u=h.u;
 if(hi==t.hist.length-1&&u&&u.start==t.start&&u.pr==(t.pr||'b')){t.sched=u.sched.slice();t.done=JSON.parse(JSON.stringify(u.done));t.resets=u.resets}
 else if(h.f!='f'&&h.cy==t.resets){const d=t.done[h.i];if(d&&d.d==h.d&&d.f==h.f)t.done[h.i]=null}
 t.hist.splice(hi,1);S.trash=S.trash||[];S.trash.unshift({tid:t.id,hi,h,d:today(),before,after:stt(t)});if(S.trash.length>60)S.trash.length=60}

 if(stt(t)==e.after){t.sched=e.before.sched.slice();t.done=JSON.parse(JSON.stringify(e.before.done));t.resets=e.before.resets}

function dueSplit(){const T=today(),due=S.topics.filter(t=>{const i=cur(t);return i!==null&&t.sched[i]<=T});
 const pr=t=>{const l=lastFb(t);return t.resets>2?0:l=='f'?1:l=='n'?2:l=='p'?3:4};due.sort((a,b)=>pr(a)-pr(b));
 let hid=[];const od=due.filter(t=>T-t.sched[cur(t)]>0&&t.pin!=T);if(od.length>=4&&!ALL)hid=od.slice(Math.ceil(od.length/2));return{due,hid}}
function calItems(n){const T=today(),R=[],ds=n>=T?dueSplit():null;
 S.topics.forEach(t=>{const c=cur(t);t.sched.forEach((s,i)=>{const d=t.done[i];if(!d&&isRm(t,i))return;
  if(d){if(s==n)R.push({t,i,k:'done',ic:FI[d.f]});if(d.s!=null&&d.s<s&&d.s==n)R.push({t,i,k:'miss',ic:MX})}
  else if(i==c&&s<T){if(s==n)R.push({t,i,k:'miss',ic:MX})}
  else if(s>=T&&s==n)R.push({t,i,k:'wait',ic:'⏳'})});
  if(ds&&c!==null&&t.sched[c]<T&&n==(ds.hid.includes(t)?T+1:T))R.push({t,i:c,k:'carry',ic:'↪⏳'})});
 return R}
function dayMap(){const T=today(),m={};const add=(d,p,c)=>{if(d>T)return;const o=m[d]||(m[d]={p:0,c:0});o.p+=p;o.c+=c};
 S.topics.forEach(t=>{t.hist.forEach(h=>{if(h.x)return;const s=h.s!=null?h.s:h.d;add(s,1,h.d<=s?1:0)});const i=cur(t);if(i!==null)add(t.sched[i],1,0)});return m}
function pctBuckets(mode){const T=today(),m=dayMap(),out=[];const sum=(a,b)=>{let p=0,c=0;for(let d=a;d<b;d++){const o=m[d];if(o){p+=o.p;c+=o.c}}return{p,c}};
 if(mode=='d'){for(let k=13;k>=0;k--){const d=T-k;out.push({l:short(d),...sum(d,d+1)})}}
 else if(mode=='w'){const ws=T-wd(T);for(let k=7;k>=0;k--){const a=ws-7*k;out.push({l:short(a),...sum(a,a+7)})}}
 else{const[jy,jm]=jd(T);for(let k=5;k>=0;k--){let y=jy,mm=jm-k;while(mm<1){mm+=12;y--}const a=jTo(y,mm,1);out.push({l:MN[mm-1],...sum(a,a+mlen(y,mm))})}}
 return out}

 C=i=>W-Rp-(i+.5)*sl,tp=data.reduce((a,d)=>a+d.p,0),tc=data.reduce((a,d)=>a+d.c,0),
 col=v=>v>=80?'var(--ok)':v>=50?'#2dd4bf':'var(--wn)',
 grid=[0,50,100].map(v=>`<line x1="${Lp}" x2="${W-Rp+4}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--bd)" stroke-dasharray="3 4"/><text x="${W-4}" y="${Y(v)+3}" text-anchor="start" font-size="9" style="fill:var(--mu)">${fa(v)}٪</text>`).join(''),
 bars=data.map((d,i)=>{const v=d.p?Math.round(d.c/d.p*100):0,h=d.p?Math.max(3,by-Y(v)):0;
  return(d.p?`<rect x="${C(i)-bw/2}" y="${by-h}" width="${bw}" height="${h}" rx="4" style="fill:${col(v)}"/><text x="${C(i)}" y="${by-h-4}" text-anchor="middle" font-size="${n>8?8:9.5}" style="fill:var(--tx)">${fa(v)}</text>`:`<rect x="${C(i)-bw/2}" y="${by-2}" width="${bw}" height="2" rx="1" style="fill:var(--bd)"/>`)+(n<=8||i%2==(n-1)%2?`<text x="${C(i)}" y="${H-8}" text-anchor="middle" font-size="9" style="fill:var(--mu)">${d.l}</text>`:'')}).join('');
 return`<div class="c"><div class="bar"><h3>✅ درصد انجام مباحث</h3><span class="row" style="flex:0 0 auto">${[['d','روز'],['w','هفته'],['m','ماه']].map(([k,l])=>`<button class="chip ${CP==k?'on':''}" onclick="CP='${k}';render()">${l}</button>`).join('')}</span></div>
 ${tp?`<svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:8px">${grid}${bars}</svg><div class="mu">مجموع این بازه: ${fa(tc)} از ${fa(tp)} مورد · ${fa(Math.round(tc/tp*100))}٪</div>`:'<div class="mu" style="margin:10px 0">هنوز مروری برای محاسبه وجود ندارد.</div>'}</div>`}

function exDraw(){const m=document.getElementById('exm');if(!m||!EXM)return;const o=EXM;
 m.innerHTML=`<div class="mdl"><h3>📝 امتحان ${esc(o.course)}</h3><div class="mu">${fmtS(o.date)}</div>
 <label>بعد از امتحان هم مرور این درس ادامه پیدا کند؟</label><div class="row"><button class="chip ${o.after?'on':''}" onclick="exSet(true)">بله</button><button class="chip ${o.after?'':'on'}" onclick="exSet(false)">خیر</button></div>
 <label>چند روز قبل از امتحان برای آماده شدن نیاز داری؟</label><select id="exp">${Array.from({length:15},(_,k)=>`<option value="${k}" ${k==o.prep?'selected':''}>${k?fa(k)+' روز':'نیاز ندارم'}</option>`).join('')}</select>
  <div class="row" style="margin-top:10px"><button class="b" style="flex:1" onclick="exSave()">ثبت</button><button class="b s" style="flex:1" onclick="exClose()">انصراف</button></div></div>`}
function exSet(v){const e=document.getElementById('exp');if(e)EXM.prep=+e.value;EXM.after=v;exDraw()}
function exClose(){EXM=null;const m=document.getElementById('exm');if(m)m.remove()}
function exSave(){if(!EXM)return;const e=document.getElementById('exp'),prep=e?+e.value:EXM.prep;
 if(EXM.id){const x=S.exams.find(y=>y.id==EXM.id);if(x){x.after=EXM.after;x.prep=prep}}
 else S.exams.push({id:Date.now(),course:EXM.course,date:EXM.date,rev:false,after:EXM.after,prep,pd:[]});
 exClose();save();render()}
function addLog(c,s,ch,m){const T=today();let t=S.topics.find(x=>x.noRev&&x.course==c&&(x.source||'')==(s||'')&&x.chapter==ch);
 if(!t){t=mk(c,s,ch,T,'b');t.noRev=true;t.mins0=m;t.done[0]={f:'p',d:T,m:0};S.topics.push(t)}
 t.done[0].m=(t.done[0].m||0)+m;t.hist.push({i:0,f:'p',d:T,m,cy:0,x:1});save()}
let TP=null,LG={c:'',s:'',h:'',m:''};
function logForm(){const cs=S.courses,ss=S.sources;if(!LG.c||!cs.includes(LG.c))LG.c=cs[0]||'';
 return`<div class="c"><h3>➕ مطالعهٔ بدون مرور</h3><label>درس</label><select onchange="LG.c=this.value">${cs.map(x=>`<option ${x==LG.c?'selected':''}>${esc(x)}</option>`).join('')}</select>
 <label>منبع</label><select onchange="LG.s=this.value"><option value="">بدون منبع</option>${ss.map(x=>`<option ${x==LG.s?'selected':''}>${esc(x)}</option>`).join('')}</select>
 <label>مبحث</label><input id="lgh" value="${esc(LG.h)}" autocomplete="off" oninput="LG.h=this.value;sgIn(this,'lg')" onfocus="sgIn(this,'lg')"><div class="sg" id="sg_lg"></div><div class="zr"><span>زمان:</span><input class="num" type="text" inputmode="numeric" pattern="[0-9]*" lang="en" autocomplete="off" value="${esc(LG.m)}" oninput="LG.m=this.value"></div>
 <button class="b" style="width:100%;margin-top:8px" onclick="lgSave()">ثبت</button></div>`}
function lgSave(){const m=Math.round(+LG.m||0);if(!LG.c||m<1){alert('درس و زمان را وارد کن');return}addLog(LG.c,LG.s,(LG.h||'').trim()||NONAME,m);LG.h='';LG.m='';TP=null;render()}
/* timer */
const PF=25*60000,PBK=5*60000;
let TS={mode:'pomo',P:{ph:'f',run:false,end:0,rem:PF,done:0},W:{run:false,st:0,acc:0},se:{a:'',b:'',tb:false}};
try{const x=JSON.parse(localStorage.getItem('medrev-timer')||'null');if(x&&x.P&&x.W&&x.se)TS=x}catch(e){}
const tsSave=()=>{try{localStorage.setItem('medrev-timer',JSON.stringify(TS))}catch(e){}};
const nowS=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const p2=n=>String(n).padStart(2,'0'),mmss=ms=>{const t=Math.ceil(ms/1000);return p2(Math.floor(t/60))+':'+p2(t%60)},hms=ms=>{const t=Math.floor(ms/1000);return p2(Math.floor(t/3600))+':'+p2(Math.floor(t%3600/60))+':'+p2(t%60)};
function pRem(){const P=TS.P;return P.run?Math.max(0,P.end-Date.now()):P.rem}
function pFocus(){const P=TS.P;return Math.round((P.done+(P.ph=='f'?PF-pRem():0))/60000)}
function pomoTick(){const P=TS.P;if(!P.run)return false;const now=Date.now();let ch=false;while(P.run&&now>=P.end){if(P.ph=='f'){P.done+=PF;P.ph='b';P.rem=PBK}else{P.ph='f';P.rem=PF}P.end+=P.rem;ch=true}return ch}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(()=>{o.stop();a.close()},350)}catch(e){}if(navigator.vibrate)try{navigator.vibrate([200,100,200])}catch(e){}}
const swEl=()=>TS.W.acc+(TS.W.run?Date.now()-TS.W.st:0);
function seDur(){const se=TS.se;if(!se.a||!se.b)return 0;const[a1,a2]=se.a.split(':').map(Number),[b1,b2]=se.b.split(':').map(Number);return((b1*60+b2)-(a1*60+a2)+1440)%1440}
function tmHtml(){pomoTick();const m=TS.mode,seg=[['pomo','پومودورو'],['sw','زمان‌سنج'],['se','شروع–پایان']].map(([k,l])=>`<button class="chip ${m==k?'on':''}" onclick="tmMode('${k}')">${l}</button>`).join('');let b='';
 if(m=='pomo'){const P=TS.P;b=`<div class="tmv" id="tmv">${mmss(pRem())}</div><div class="mu" id="tmf" style="text-align:center">${P.ph=='f'?'تمرکز ۲۵ دقیقه‌ای':'استراحت ۵ دقیقه‌ای'} · تمرکز انجام‌شده: ${fmtM(pFocus())}</div><div class="row" style="margin-top:8px"><button class="b" style="flex:1" onclick="pToggle()">${P.run?'توقف':'شروع'}</button><button class="b s" style="flex:1" onclick="pReset()">ریست</button></div><button class="b s" style="width:100%;margin-top:6px" onclick="tmLog('pomo')">ثبت در مطالعه</button>`}
 else if(m=='sw'){b=`<div class="tmv" id="tmv">${hms(swEl())}</div><div class="row" style="margin-top:8px"><button class="b" style="flex:1" onclick="wToggle()">${TS.W.run?'توقف':'شروع'}</button><button class="b s" style="flex:1" onclick="wReset()">ریست</button></div><button class="b s" style="width:100%;margin-top:6px" onclick="tmLog('sw')">ثبت در مطالعه</button>`}
 else{const se=TS.se;if(!se.a)se.a=nowS();if(!se.tb)se.b=nowS();tsSave();
  b=`<div class="se"><div><label>ساعت شروع</label><input type="time" id="se1" lang="en" value="${se.a}" onchange="seSet('a',this.value)"><button class="b s" style="width:100%;margin-top:4px" onclick="seNow('a')">اکنون</button></div><div><label>ساعت پایان</label><input type="time" id="se2" lang="en" value="${se.b}" onfocus="seFocus(this)" onchange="seSet('b',this.value)"><button class="b s" style="width:100%;margin-top:4px" onclick="seNow('b')">اکنون</button></div></div><div class="mu" style="margin-top:8px;text-align:center">مدت</div><div class="tmv sm" id="tmv">${fmtM(seDur())}</div><button class="b s" style="width:100%" onclick="tmLog('se')">ثبت در مطالعه</button>`}
 return`<div class="row" style="margin-bottom:8px;flex-wrap:wrap">${seg}</div>${b}`}
function tmDraw(){const e=document.getElementById('tmp');if(e)e.innerHTML=tmHtml()}
function tmMode(k){TS.mode=k;tsSave();tmDraw()}
function pToggle(){const P=TS.P;if(P.run){P.rem=Math.max(0,P.end-Date.now());P.run=false}else{P.end=Date.now()+P.rem;P.run=true}tsSave();tmDraw()}
function pReset(){TS.P={ph:'f',run:false,end:0,rem:PF,done:0};tsSave();tmDraw()}
function wToggle(){const W=TS.W;if(W.run){W.acc+=Date.now()-W.st;W.run=false}else{W.st=Date.now();W.run=true}tsSave();tmDraw()}
function wReset(){TS.W={run:false,st:0,acc:0};tsSave();tmDraw()}
function seSet(k,v){TS.se[k]=v;if(k=='b')TS.se.tb=true;tsSave();const e=document.getElementById('tmv');if(e)e.textContent=fmtM(seDur())}
function seNow(k){const v=nowS(),e=document.getElementById(k=='a'?'se1':'se2');if(e)e.value=v;if(k=='a'){const f=document.getElementById('se2');if(f)f.value=v;TS.se.b=v;TS.se.tb=false}seSet(k,v)}
function seFocus(el){if(!TS.se.tb){el.value=nowS();TS.se.b=el.value;tsSave();const e=document.getElementById('tmv');if(e)e.textContent=fmtM(seDur())}}
function tmLog(k){let m=0;if(k=='pomo'){m=pFocus();pReset()}else if(k=='sw'){m=Math.max(swEl()>0?1:0,Math.round(swEl()/60000));wReset()}else{m=seDur();TS.se={a:'',b:'',tb:false};tsSave()}
 if(m<1){alert('هنوز زمانی ثبت نشده');tmDraw();return}LG.m=String(m);TP='log';render()}
function tpTog(k){TP=TP==k?null:k;render()}
function toolsHtml(){return`<div class="row" style="margin:0 0 8px;gap:8px;flex-wrap:wrap"><button class="chip ${TP=='log'?'on':''}" onclick="tpTog('log')">➕ مطالعهٔ بدون مرور</button><button class="chip ${TP=='timer'?'on':''}" onclick="tpTog('timer')">⏲ تایمر</button></div>`+(TP=='timer'?`<div class="c" id="tmp">${tmHtml()}</div>`:TP=='log'?logForm():'')}
const vt3=viewToday;viewToday=()=>{const h=vt3(),k=h.indexOf('<div class="stat">');return k<0?h:h.slice(0,k)+toolsHtml()+h.slice(k)};
setInterval(()=>{if(tab!=='today'||TP!=='timer')return;const m=TS.mode;
 if(m=='pomo'){if(pomoTick()){beep();tsSave();tmDraw();return}const e=document.getElementById('tmv');if(e)e.textContent=mmss(pRem())}
 else if(m=='sw'){const e=document.getElementById('tmv');if(e)e.textContent=hms(swEl())}},500);
const go3=go;go=function(t){exClose();go3(t)};

let DQ=null,DQT=null;
function dqArm(k){DQ=k;clearTimeout(DQT);DQT=setTimeout(()=>{if(DQ===k){DQ=null;if(tab==='list')render()}},4000);render()}
function del(id){const k='t'+id;if(DQ!==k){dqArm(k);return}DQ=null;const dt=S.topics.find(x=>String(x.id)===String(id));if(dt)dtPush({k:'topic',topic:dt,d:today()});S.topics=S.topics.filter(x=>String(x.id)!==String(id));save();render()}
function delCourseI(ci){const cs=lsCourses(),n=cs[ci];if(!n)return;const k='c'+ci;if(DQ!==k){dqArm(k);return}DQ=null;purge(n);render()}
const go4=go;go=function(t){DQ=null;go4(t)};

/* ===== ordering, suggestions, deleted history, time model ===== */
const NONAME='بدون نام';
const tst=t=>cur(t)===null?2:(t.hist.length==0&&t.done.every(x=>!x)?1:0);
function gst(ts){if(!ts.length)return 1;const a=ts.map(tst);if(a.some(x=>x==0))return 0;const nf=a.filter(x=>x==2).length;return nf==a.length?2:nf==0?1:0}
function lsCourses(){const base=[...new Set([...S.courses,...S.topics.map(t=>t.course)])].filter(c=>S.topics.some(t=>t.course==c));return base.map((c,i)=>({c,i,s:gst(S.topics.filter(t=>t.course==c))})).sort((a,b)=>a.s-b.s||a.i-b.i).map(x=>x.c)}
function lsChapters(c){const ts=S.topics.filter(t=>t.course==c),base=[...new Set(ts.map(t=>t.chapter))];return base.map((h,i)=>({h,i,s:gst(ts.filter(t=>t.chapter==h))})).sort((a,b)=>a.s-b.s||a.i-b.i).map(x=>x.h)}
function baseOf(t){let b=t.mins0||0;for(const h of t.hist){if(!(h.m>0))continue;const c=h.i==0?h.m:h.m*(h.i+2);b=b?Math.round(b*.4+c*.6):c}return b}
const SG={};
function chNames(c){return[...new Set(S.topics.filter(t=>t.course==c&&t.chapter&&t.chapter!==NONAME&&t.chapter!=='آمادگی امتحان').map(t=>t.chapter))].reverse()}
function sgIn(el,k){const c=k=='lg'?LG.c:((document.getElementById('fc')||{}).value||'').trim(),q=el.value.trim(),box=document.getElementById('sg_'+k);if(!box)return;
 const l=chNames(c).filter(n=>(!q||n.includes(q))&&n!==q).slice(0,6);SG[k]=l;
 box.innerHTML=l.map((n,i)=>`<button type="button" class="chip" onpointerdown="event.preventDefault()" onclick="sgPick('${k}',${i})">${esc(n)}</button>`).join('')}
function sgPick(k,i){const n=(SG[k]||[])[i];if(n==null)return;const el=document.getElementById(k=='lg'?'lgh':'fh');if(el)el.value=n;if(k=='lg')LG.h=n;else if(ff)ff.h=n;const b=document.getElementById('sg_'+k);if(b)b.innerHTML=''}
function dtPush(e){S.dtrash=S.dtrash||[];S.dtrash.unshift(e);if(S.dtrash.length>40)S.dtrash.length=40}
function dtList(){const T=today();return(S.dtrash||[]).filter(e=>T-e.d<=30)}
let DD=null;
function dtRestore(k){const e=(S.dtrash||[])[k];if(!e)return;const add=t=>{if(!S.topics.some(x=>x.id===t.id))S.topics.push(t);if(t.source)addList('sources',t.source)};
 if(e.k=='course'){e.topics.forEach(add);(e.exams||[]).forEach(x=>{if(!S.exams.some(y=>y.id===x.id))S.exams.push(x)});addList('courses',e.name)}
 else{add(e.topic);addList('courses',e.topic.course)}
 S.dtrash.splice(k,1);save();render()}
function dtDrop(k){if(DD!==k){DD=k;render();return}DD=null;S.dtrash.splice(k,1);save();render()}
function dtCard(){const L=dtList();return`<div class="c"><h3>🗑 حذف‌شده‌ها</h3>${L.length?L.map(e=>{const k=S.dtrash.indexOf(e),ttl=e.k=='course'?`درس ${esc(e.name)} (${fa(e.topics.length)} منبع)`:`${esc(e.topic.course)} · ${esc(e.topic.chapter)}${e.topic.source?' · '+esc(e.topic.source):''}`;
 return`<div class="hr" style="padding:6px 0"><span>${e.k=='course'?'📚':'📄'} ${ttl}<div class="mu">${fmtS(e.d)}</div></span><span class="row" style="flex:0 0 auto;gap:6px"><button class="b s" onclick="dtRestore(${k})">بازیابی</button><button class="b s" style="color:var(--red)" onclick="dtDrop(${k})">${DD===k?'مطمئنی؟':'✕'}</button></span></div>`}).join(''):'<div class="mu">چیزی حذف نشده است.</div>'}</div>`}
const vs0=viewSet;viewSet=()=>vs0()+dtCard();
const go5=go;go=function(t){DD=null;go5(t)};
applyTheme();
render();
</script></body></html>
